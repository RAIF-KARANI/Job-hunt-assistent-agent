# Our changes to Langfuse's official docker-compose.yml (kept unmodified next
# to this file). Docker Compose merges this override automatically.
#
#   cd infra\langfuse
#   docker compose up -d        start (first time downloads ~1-2 GB of images)
#   docker compose ps           status
#   docker compose stop         stop (keeps your traces; stays stopped, see 4.)
#   docker compose down -v      delete everything, including all traces
#
# Why these changes:
# 1. Ports. Your PC already uses 5432 (a local PostgreSQL) and 6379
#    (billing-redis). The internal services only talk to each other over
#    Docker's private network, so they don't need host ports at all:
#    `!reset []` removes them. Only the dashboard (3000) and MinIO (9090,
#    used by the browser for media uploads) stay reachable, and only from
#    THIS machine (127.0.0.1), not from other devices on your network.
# 2. Telemetry off: don't send usage statistics to Langfuse.
# 3. ClickHouse's own diagnostic logs off (22 Nov 2026): clickhouse/*.xml.
#    They had grown to 45 GB (trace_log alone 42.7 GB) and kept ClickHouse
#    at 150-250 % CPU with nothing to trace. Langfuse never reads them.
# 4. restart: unless-stopped (was always): after `docker compose stop`,
#    Langfuse stays off when Docker restarts, until `docker compose up -d`.
#    JobLens doesn't need it unless Settings -> Tracing is set to Langfuse.
# Secrets and the auto-created user/project/keys come from .env (git-ignored).

services:
  langfuse-web:
    restart: unless-stopped
    ports: !override
      - 127.0.0.1:3000:3000
    environment:
      TELEMETRY_ENABLED: "false"

  langfuse-worker:
    restart: unless-stopped
    ports: !reset []
    environment:
      TELEMETRY_ENABLED: "false"

  minio:
    restart: unless-stopped
    ports: !override
      - 127.0.0.1:9090:9000

  postgres:
    restart: unless-stopped
    ports: !reset []

  redis:
    restart: unless-stopped
    ports: !reset []

  clickhouse:
    restart: unless-stopped
    ports: !reset []
    volumes:
      - ./clickhouse/no-system-logs.xml:/etc/clickhouse-server/config.d/no-system-logs.xml:ro
      - ./clickhouse/no-profiler.xml:/etc/clickhouse-server/users.d/no-profiler.xml:ro
