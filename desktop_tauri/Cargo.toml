[package]
name = "joblens"
version = "2.0.0"
description = "JobLens's window (version 3): Rust shows, Python decides (decision E6)"
edition = "2021"
publish = false
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
